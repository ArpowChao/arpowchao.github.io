<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c99dc"/>
      <stop offset="100%" stop-color="#a8e0fa"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#sky)" stroke="#1a354d" stroke-width="2.5"/>
  <!-- Soft sea horizon -->
  <path d="M5 45 Q20 41 32 45 T59 44 A29 29 0 0 1 5 45 Z" fill="#2374ab" opacity="0.45"/>
  <!-- Sun disc -->
  <circle cx="48" cy="17" r="6" fill="#ffd97d"/>
  <!-- Seagull back wing -->
  <path d="M27 25 Q18 11 8 15 Q17 20 23 28 Z" fill="#e6f1f8" stroke="#1a354d" stroke-width="2" stroke-linejoin="round"/>
  <!-- Seagull body -->
  <path d="M12 31 Q22 23 36 25 Q43 26 45 23 Q48 25 45 29 Q39 36 25 36 Q16 35 12 31 Z" fill="#fffdf7" stroke="#1a354d" stroke-width="2" stroke-linejoin="round"/>
  <!-- Wing tip marking -->
  <path d="M13 15.5 Q10 14.8 8 15 Q11 17 14 18.5 Z" fill="#475569"/>
  <!-- Front wing -->
  <path d="M31 28 Q26 14 15 10 Q23 19 26 30 Z" fill="#fffdf7" stroke="#1a354d" stroke-width="2" stroke-linejoin="round"/>
  <!-- Beak -->
  <path d="M45 24 L53 26.5 L45 28.5 Z" fill="#f59e0b" stroke="#1a354d" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Eye -->
  <circle cx="42" cy="24.5" r="1.4" fill="#1a354d"/>
  <!-- Hanging Airmail Envelope -->
  <g transform="translate(46, 30) rotate(-8)">
    <rect x="0" y="0" width="14" height="10" rx="1.8" fill="#fffdf7" stroke="#1a354d" stroke-width="1.6"/>
    <path d="M1 1 L7 6 L13 1" fill="none" stroke="#2b7de9" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="2" y1="8.5" x2="12" y2="8.5" stroke="#d94862" stroke-width="1.4"/>
  </g>
</svg>
