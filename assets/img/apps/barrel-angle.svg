<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="sky" cx="45%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#172b44"/>
      <stop offset="100%" stop-color="#070e18"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#225b2b"/>
      <stop offset="100%" stop-color="#133619"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <path d="M0 360 L800 360 L800 500 L0 500 Z" fill="url(#grass)"/>
  <ellipse cx="140" cy="390" rx="85" ry="22" fill="#8b6240"/>

  <!-- Outfield Wall at 110m -->
  <rect x="650" y="325" width="8" height="38" fill="#facc15"/>
  <text x="654" y="314" fill="#facc15" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">110m</text>

  <!-- Vacuum 45 deg parabola (dashed grey-blue) -->
  <path d="M 140 375 Q 460 10 780 375" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.55"/>
  <text x="470" y="128" fill="#94a3b8" font-family="sans-serif" font-size="14">真空 45° (197m)</text>

  <!-- 0~60 deg Fan lines -->
  <g stroke="#e2e8f0" stroke-width="1.5" opacity="0.32" fill="none">
    <path d="M 140 375 Q 320 310 470 375"/>
    <path d="M 140 375 Q 360 250 560 375"/>
    <path d="M 140 375 Q 390 165 595 375"/>
    <path d="M 140 375 Q 370 110 540 375"/>
  </g>

  <!-- 60~90 deg High Pop-up & Backward Loop trajectories -->
  <g stroke="#ff9f43" stroke-width="2.2" opacity="0.8" fill="none">
    <path d="M 140 375 Q 290 55 410 375"/>
    <path d="M 140 375 Q 210 35 250 375"/>
    <path d="M 140 375 C 145 40, 95 60, 68 375" stroke="#ff5e7e" stroke-width="2.8"/>
  </g>
  <text x="85" y="165" fill="#ff9f43" font-family="sans-serif" font-size="14" font-weight="bold">60°–90° 沖天炮與後旋倒退</text>

  <!-- 26~30 deg MLB Barrel Neon Zone -->
  <g filter="url(#glow)" fill="none" stroke="#c8ff2e">
    <path d="M 140 375 Q 425 185 685 352" stroke-width="5"/>
    <path d="M 140 375 Q 430 168 695 348" stroke-width="7"/>
    <path d="M 140 375 Q 428 152 688 350" stroke-width="5"/>
  </g>
  <circle cx="695" cy="348" r="8" fill="#ffffff" filter="url(#glow)"/>

  <!-- Barrel Badge -->
  <rect x="385" y="196" width="146" height="36" rx="8" fill="#c8ff2e"/>
  <text x="458" y="220" fill="#0b1400" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">26°～30° Barrel</text>

  <!-- Title -->
  <text x="40" y="466" fill="#c8ff2e" font-family="Georgia, serif" font-size="42" font-weight="bold" letter-spacing="4">BARREL</text>
  <text x="238" y="462" fill="#e2e8f0" font-family="sans-serif" font-size="20">全壘打仰角與空氣阻力實驗室 (0°–90°)</text>
</svg>
