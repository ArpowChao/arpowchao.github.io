<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="space" cx="50%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#0f233f"/>
      <stop offset="65%" stop-color="#060d1b"/>
      <stop offset="100%" stop-color="#02050b"/>
    </radialGradient>
    <radialGradient id="earth" cx="35%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="35%" stop-color="#1e68b8"/>
      <stop offset="75%" stop-color="#0c3469"/>
      <stop offset="100%" stop-color="#041229"/>
    </radialGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#space)"/>

  <!-- Stars -->
  <g fill="#e2e8f0" opacity="0.65">
    <circle cx="95" cy="70" r="1.4"/>
    <circle cx="180" cy="120" r="1"/>
    <circle cx="670" cy="65" r="1.5"/>
    <circle cx="720" cy="180" r="1.1"/>
    <circle cx="610" cy="390" r="1.3"/>
    <circle cx="130" cy="340" r="1.2"/>
  </g>

  <!-- 5 Trajectories around Earth centered at (370, 225), R=118 -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <!-- 4. Elliptical Orbit (Lavender) -->
    <ellipse cx="370" cy="255" rx="164" ry="185" stroke="#c4b5fd" stroke-width="2.6" opacity="0.9"/>
    <!-- 3. Circular Orbit (Mint) -->
    <circle cx="370" cy="225" r="154" stroke="#5eead4" stroke-width="3.2"/>
    <!-- 1. Short Suborbital (Coral) -->
    <path d="M 370 71 Q 435 74 452 140" stroke="#ff6b6b" stroke-width="3"/>
    <!-- 2. Long Suborbital (Amber) -->
    <path d="M 370 71 Q 495 78 486 232" stroke="#ffd166" stroke-width="3"/>
    <!-- 5. Escape Hyperbola (Rose) -->
    <path d="M 370 71 Q 575 72 745 275" stroke="#f472b6" stroke-width="3.2"/>
  </g>

  <!-- Atmosphere & Earth Globe -->
  <circle cx="370" cy="225" r="142" fill="url(#atmo)"/>
  <circle cx="370" cy="225" r="118" fill="url(#earth)" stroke="#7dd3fc" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- Simplified Euro-African Continent Silhouette -->
  <path d="M 335 190 L 385 186 L 415 210 L 400 265 L 375 308 L 352 275 L 348 230 Z" fill="#468352" opacity="0.72"/>
  <path d="M 342 148 L 395 142 L 412 168 L 368 176 Z" fill="#4d8a59" opacity="0.75"/>

  <!-- Newton's Mountain & Cannon at (370, 71) -->
  <polygon points="346,110 370,71 394,110" fill="#64748b"/>
  <polygon points="357,91 370,71 383,91" fill="#f8fafc"/>
  <rect x="365" y="66" width="18" height="6" rx="2" fill="#e2e8f0"/>
  <circle cx="388" cy="69" r="6" fill="#fde047" opacity="0.85" filter="url(#glow)"/>

  <!-- Cannonballs -->
  <circle cx="452" cy="140" r="4.5" fill="#ff6b6b"/>
  <circle cx="486" cy="232" r="4.5" fill="#ffd166"/>
  <circle cx="216" cy="225" r="5.5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="370" cy="440" r="5" fill="#c4b5fd"/>
  <circle cx="712" cy="240" r="5.5" fill="#f472b6"/>

  <!-- Labels -->
  <text x="555" y="135" fill="#5eead4" font-family="sans-serif" font-size="15" font-weight="bold">v = v_c (7.50 km/s 圓軌道)</text>
  <text x="585" y="195" fill="#f472b6" font-family="sans-serif" font-size="15" font-weight="bold">v ≥ v_e (10.8 km/s 逃逸)</text>

  <!-- Title -->
  <text x="40" y="464" fill="#5eead4" font-family="Georgia, serif" font-size="40" font-weight="bold" letter-spacing="4">CANNON</text>
  <text x="255" y="460" fill="#e2e8f0" font-family="sans-serif" font-size="20">牛頓大砲與軌道誕生實驗室 (Principia, 1687)</text>
</svg>
